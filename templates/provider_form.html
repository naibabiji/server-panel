{{template "base" .}}
{{define "provider_form_content"}}
<div x-data="providerForm()" class="p-6 max-w-2xl">
    <h2 class="text-lg font-semibold text-purple-300 mb-6" x-text="isEdit ? t('provider.title_edit') : t('provider.title_add')"></h2>
    <div class="card space-y-4" x-show="loading" x-cloak>
        <div class="skeleton-block h-9"></div>
        <div class="skeleton-block h-9"></div>
        <div class="skeleton-block h-9"></div>
        <div class="skeleton-block h-9"></div>
    </div>
    <div class="card space-y-4" x-show="!loading">
        <div><label class="label">{{t .Lang "provider.name_label"}} <span class="text-red-400">*</span></label><input type="text" x-model="form.name" class="input-field" placeholder="{{t .Lang "provider.name_placeholder"}}"></div>
        <div><label class="label">{{t .Lang "provider.website_label"}}</label><input type="text" x-model="form.website" class="input-field" placeholder="https://..."></div>
        <div><label class="label">{{t .Lang "provider.contact_label"}}</label><input type="text" x-model="form.contact" class="input-field" placeholder="{{t .Lang "provider.contact_placeholder"}}"></div>
        <div>
            <label class="label">{{t .Lang "provider.private_notes_label"}}</label>
            <textarea x-model="form.private_notes" class="input-field" rows="3" :placeholder="isEdit && hasPrivateNotes ? t('provider.private_notes_placeholder_saved') : t('provider.private_notes_placeholder_empty')"></textarea>
            <div class="text-xs text-gray-500 mt-1" x-show="isEdit && hasPrivateNotes">{{t .Lang "provider.private_notes_hint"}}</div>
        </div>
        <div><label class="label">{{t .Lang "server_form.notes_label"}}</label><textarea x-model="form.notes" class="input-field" rows="3"></textarea></div>
        <div class="flex gap-3 pt-2">
            <button @click="save()" class="btn-primary" :disabled="saving"><span x-show="!saving">{{t .Lang "common.save"}}</span><span x-show="saving">{{t .Lang "common.saving"}}</span></button>
            <a href="/{{.RandomSuffix}}/providers" class="btn-secondary">{{t .Lang "common.cancel"}}</a>
        </div>
    </div>
</div>
<script>
function providerForm() {
    return {
        isEdit: false, id: null, saving: false, loading: false, hasPrivateNotes: false,
        form: { name:'', website:'', contact:'', private_notes:'', notes:'' },
        async init() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const last = parts[parts.length-1];
            if (last === 'edit') this.id = parts[parts.length-2];
            else if (last !== 'new') this.id = last;
            if (this.id) {
                this.isEdit = true;
                this.loading = true;
                await this.load();
                this.loading = false;
            }
        },
        async load() {
            try {
                const d = await api('/api/providers/'+this.id);
                Object.assign(this.form, d.data);
                this.form.private_notes = '';
                this.hasPrivateNotes = !!d.data.has_private_notes;
            } catch(e) {}
        },
        async save() {
            this.saving = true;
            try {
                if (!this.form.name) { showToast(t('provider.name_required'),'error'); this.saving=false; return; }
                const method = this.isEdit ? 'PUT' : 'POST';
                const url = this.isEdit ? '/api/providers/'+this.id : '/api/providers';
                await api(url, {method, body: this.form});
                showToast(t('common.save_success'),'success');
                const target = this.isEdit ? '/providers/' + this.id : '/providers';
                setTimeout(() => location.href = document.body.dataset.panelPrefix + target, 500);
            } catch(e) { showToast(e.message,'error'); }
            this.saving = false;
        }
    }
}
</script>
{{end}}
