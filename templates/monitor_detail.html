{{template "base" .}}
{{define "monitor_detail_content"}}
<div x-data="monitorDetail()" class="p-6">
    <div class="flex items-center justify-between mb-4">
        <div>
            <h2 class="text-lg font-semibold text-purple-300" x-text="server.name || t('common.loading')"></h2>
            <div class="text-xs text-gray-500 mt-1" x-text="server.ip_address"></div>
        </div>
        <div class="flex gap-2">
            <select @change="changeRange($event.target.value)" class="input-field w-28 text-sm">
                <option value="24h">{{t .Lang "dashboard.range_24h"}}</option>
                <option value="7d">{{t .Lang "dashboard.range_7d"}}</option>
                <option value="15d">{{t .Lang "dashboard.range_15d"}}</option>
                <option value="30d">{{t .Lang "dashboard.range_30d"}}</option>
            </select>
            <a :href="'../servers/'+server.id" class="btn-secondary text-sm" x-show="server.id">{{t .Lang "title.server_detail"}}</a>
            <a href="../monitor" class="btn-secondary text-sm">{{t .Lang "monitor.back"}}</a>
        </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6" x-show="loading" x-cloak>
        <div class="card"><div class="skeleton-block h-3 w-10 mb-2"></div><div class="skeleton-block h-6 w-16"></div></div>
        <div class="card"><div class="skeleton-block h-3 w-10 mb-2"></div><div class="skeleton-block h-6 w-16"></div></div>
        <div class="card"><div class="skeleton-block h-3 w-10 mb-2"></div><div class="skeleton-block h-6 w-16"></div></div>
        <div class="card"><div class="skeleton-block h-3 w-10 mb-2"></div><div class="skeleton-block h-6 w-16"></div></div>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6" x-show="!loading">
        <div class="card">
            <div class="text-xs text-gray-400">{{t .Lang "dashboard.cpu"}}</div>
            <div class="text-xl font-bold mt-1" :class="monitorMetricClass(latest, 'cpu_percent', server.cpu_cores)" x-text="monitorMetricText(latest, 'cpu_percent')"></div>
        </div>
        <div class="card">
            <div class="text-xs text-gray-400">{{t .Lang "dashboard.memory"}}</div>
            <div class="text-xl font-bold mt-1" :class="monitorMetricClass(latest, 'memory_percent', server.cpu_cores)" x-text="monitorMetricText(latest, 'memory_percent')"></div>
        </div>
        <div class="card">
            <div class="text-xs text-gray-400">{{t .Lang "dashboard.disk"}}</div>
            <div class="text-xl font-bold mt-1" :class="monitorMetricClass(latest, 'disk_percent', server.cpu_cores)" x-text="monitorMetricText(latest, 'disk_percent')"></div>
        </div>
        <div class="card">
            <div class="text-xs text-gray-400">{{t .Lang "dashboard.load_1m"}}</div>
            <div class="text-xl font-bold mt-1" :class="monitorMetricClass(latest, 'load_avg_1', server.cpu_cores)" x-text="monitorMetricText(latest, 'load_avg_1')"></div>
        </div>
    </div>

    <div class="card mb-4" style="height:260px;position:relative;"><canvas id="cpuChart"></canvas></div>
    <div class="card mb-4" style="height:260px;position:relative;"><canvas id="memChart"></canvas></div>
    <div class="card" style="height:260px;position:relative;"><canvas id="loadChart"></canvas></div>
</div>
<script>
// makeChart/updateCharts/destroyCharts/hexToRGBA/niceLoadAxisMax are shared
// globals defined in static/js/app.js (also used by templates/dashboard.html).
function monitorDetail() {
    return {
        server: {}, latest: {}, currentRange: '24h', loading: true,
        async init() {
            const id = window.location.pathname.split('/').filter(Boolean).pop();
            await Promise.all([
                (async () => { try { const d = await api('/api/servers/'+id); this.server = d.data; } catch(e) {} })(),
                (async () => { try { const d = await api('/api/monitor/'+id+'/latest'); this.latest = d.data; } catch(e) {} })(),
                this.loadCharts(),
            ]);
            this.loading = false;
        },
        async loadCharts(range) {
            const r = range || this.currentRange;
            this.currentRange = r;
            const id = window.location.pathname.split('/').filter(Boolean).pop();
            try {
                const d = await api('/api/monitor/'+id+'?range='+r);
                updateCharts(d.data || []);
            } catch(e) { console.error(e); }
        },
        changeRange(range) { this.loadCharts(range); }
    }
}
</script>
{{end}}
