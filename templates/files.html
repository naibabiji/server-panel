{{template "base" .}}
{{define "files_content"}}
<div x-data="fileManagerPage()" class="p-6 space-y-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
        <div><h2 class="text-lg font-semibold text-gray-100">文件管理</h2><p class="text-sm text-gray-500 mt-1">管理挂载盘、面板备份和你明确授权的普通目录。</p></div>
        <button x-show="currentRoot" @click="closeRoot()" class="btn-secondary text-sm">返回目录列表</button>
    </div>

    <div x-show="!currentRoot" x-cloak class="space-y-4">
        <div class="border border-blue-800/60 bg-blue-950/20 px-4 py-3 text-sm text-blue-200">出于安全考虑，普通文件管理不会开放服务器根目录 <code>/</code>。需要系统级维护时，请使用 SSH/SFTP，并在修改前备份。</div>
        <div class="border border-[#2a3038] bg-[#171b21] p-5">
            <div class="flex flex-wrap items-end gap-3 mb-5">
                <div class="flex-1 min-w-64"><label class="label">添加需要管理的目录</label><input x-model.trim="newRoot.path" class="input-field font-mono" placeholder="例如 /var/www、/home/backup、/srv/files"></div>
                <div class="w-48"><label class="label">显示名称（可选）</label><input x-model.trim="newRoot.name" class="input-field" placeholder="网站文件"></div>
                <button @click="addRoot()" :disabled="addingRoot" class="btn-primary disabled:opacity-60" x-text="addingRoot ? '正在添加…' : '添加目录'"></button>
            </div>
            <div class="text-xs text-gray-500 mb-4">允许添加 /mnt、/home、/srv、/var/www、/opt 下的现有目录。挂载到 /mnt 的数据盘会自动出现。</div>
            <div x-show="loadingRoots" class="py-10 text-center text-gray-500">正在读取可管理目录…</div>
            <div x-show="!loadingRoots && roots.length===0" class="py-10 text-center text-gray-500">还没有可管理目录。挂载数据盘或在上方添加目录后即可使用。</div>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                <template x-for="root in roots" :key="root.path"><div class="border border-[#2a3038] p-4 hover:border-blue-700">
                    <div class="flex justify-between gap-3"><div class="min-w-0"><div class="font-medium text-gray-100" x-text="root.name"></div><div class="font-mono text-xs text-gray-500 mt-1 truncate" x-text="root.path"></div></div><span class="badge-info h-fit" x-text="root.source==='mounted'?'已挂载数据盘':(root.source==='panel'?'面板目录':'自定义')"></span></div>
                    <div class="flex gap-3 mt-4"><button @click="openRoot(root)" class="btn-primary text-sm">打开目录</button><button x-show="root.source==='custom'" @click="removeRoot(root)" class="text-sm text-red-400">移除入口</button></div>
                </div></template>
            </div>
        </div>
    </div>

    <div x-show="currentRoot" x-cloak class="border border-[#2a3038] bg-[#171b21] p-5">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div><div class="font-medium text-gray-100" x-text="currentRoot?.name"></div><div class="font-mono text-xs text-gray-500 mt-1" x-text="currentRoot?.path + (currentPath==='/'?'':currentPath)"></div></div>
            <div class="flex flex-wrap gap-2">
                <button @click="goParent()" :disabled="currentPath==='/' || busy" class="btn-secondary text-sm disabled:opacity-50">上一级</button>
                <button @click="loadFiles()" :disabled="busy" class="btn-secondary text-sm">刷新</button>
                <button @click="createDirectory()" :disabled="busy" class="btn-secondary text-sm">新建目录</button>
                <label class="btn-primary text-sm cursor-pointer" :class="busy?'opacity-50 pointer-events-none':''">上传文件<input type="file" class="hidden" @change="upload($event)"></label>
            </div>
        </div>
        <div x-show="busy" class="mb-4 border border-blue-800 bg-blue-950/30 px-3 py-2 text-sm text-blue-200" x-text="busyText"></div>
        <div x-show="clipboard" class="mb-4 border border-green-800 bg-green-950/30 px-3 py-2 text-sm text-green-200 flex justify-between"><span x-text="(clipboard?.move?'准备移动：':'准备复制：') + clipboard?.name"></span><span><button @click="paste()" class="text-green-300 mr-3">粘贴到当前目录</button><button @click="clipboard=null" class="text-gray-400">取消</button></span></div>
        <div class="overflow-x-auto"><table class="w-full"><thead><tr><th class="table-header">名称</th><th class="table-header">大小</th><th class="table-header">权限</th><th class="table-header">修改时间</th><th class="table-header">操作</th></tr></thead><tbody>
            <template x-for="entry in entries" :key="entry.path"><tr class="border-t border-gray-700/50">
                <td class="table-cell"><button @click="entry.is_dir && openDirectory(entry)" :class="entry.is_dir?'text-blue-300 hover:text-blue-200':'text-gray-200'" class="text-left"><span x-text="entry.is_dir?'📁 ':'📄 '"></span><span x-text="entry.name"></span></button></td>
                <td class="table-cell text-sm text-gray-400" x-text="entry.is_dir?'目录':formatBytes(entry.size)"></td><td class="table-cell font-mono text-xs text-gray-500" x-text="entry.mode"></td><td class="table-cell text-sm text-gray-500" x-text="formatTime(entry.mod_time)"></td>
                <td class="table-cell whitespace-nowrap space-x-3"><button x-show="!entry.is_dir" @click="download(entry)" class="text-sm text-blue-400">下载</button><button @click="rename(entry)" class="text-sm text-yellow-400">重命名</button><button @click="setClipboard(entry,false)" class="text-sm text-green-400">复制</button><button @click="setClipboard(entry,true)" class="text-sm text-orange-400">移动</button><button @click="compress(entry)" class="text-sm text-purple-400">压缩</button><button x-show="!entry.is_dir && entry.name.toLowerCase().endsWith('.zip')" @click="extract(entry)" class="text-sm text-cyan-400">解压</button><button @click="remove(entry)" class="text-sm text-red-400">删除</button></td>
            </tr></template>
            <tr x-show="!loadingFiles && entries.length===0"><td colspan="5" class="py-10 text-center text-gray-500">目录为空</td></tr>
        </tbody></table></div>
    </div>
</div>
<script>
function fileManagerPage(){return{
    roots:[],entries:[],currentRoot:null,currentPath:'/',loadingRoots:false,loadingFiles:false,busy:false,busyText:'',addingRoot:false,newRoot:{path:'',name:''},clipboard:null,
    async init(){await this.loadRoots();},
    async loadRoots(){this.loadingRoots=true;try{const r=await api('/api/files/roots');this.roots=r.data||[];}catch(e){}finally{this.loadingRoots=false;}},
    async addRoot(){if(!this.newRoot.path)return;const token=await unlockViewPasswordPrompt();if(!token)return;this.addingRoot=true;try{await api('/api/files/roots',{method:'POST',headers:{'X-View-Token':token},body:this.newRoot});this.newRoot={path:'',name:''};showToast('目录已添加','success');await this.loadRoots();}catch(e){}finally{this.addingRoot=false;}},
    async removeRoot(root){if(!await confirmModal('仅移除文件管理入口，不会删除服务器文件。确认移除 '+root.path+'？'))return;const token=await unlockViewPasswordPrompt();if(!token)return;try{await api('/api/files/roots?root='+encodeURIComponent(root.path),{method:'DELETE',headers:{'X-View-Token':token}});await this.loadRoots();}catch(e){}},
    async openRoot(root){this.currentRoot=root;this.currentPath='/';this.clipboard=null;await this.loadFiles();},closeRoot(){this.currentRoot=null;this.entries=[];this.clipboard=null;},
    async loadFiles(){this.loadingFiles=true;try{const r=await api('/api/files/list?root='+encodeURIComponent(this.currentRoot.path)+'&path='+encodeURIComponent(this.currentPath));this.entries=r.data||[];}catch(e){}finally{this.loadingFiles=false;}},
    openDirectory(entry){this.currentPath=entry.path;this.loadFiles();},goParent(){if(this.currentPath==='/')return;const p=this.currentPath.split('/').filter(Boolean);p.pop();this.currentPath=p.length?'/'+p.join('/'):'/';this.loadFiles();},
    async writeAction(label,fn){const token=await unlockViewPasswordPrompt();if(!token)return;this.busy=true;this.busyText=label;try{await fn(token);await this.loadFiles();showToast(label.replace('正在','')+'完成','success');}catch(e){}finally{this.busy=false;}},
    async createDirectory(){const name=window.prompt('请输入新目录名称');if(!name)return;await this.writeAction('正在创建目录…',t=>api('/api/files/mkdir',{method:'POST',headers:{'X-View-Token':t},body:{root:this.currentRoot.path,path:this.currentPath,name}}));},
    async rename(entry){const name=window.prompt('请输入新名称',entry.name);if(!name||name===entry.name)return;await this.writeAction('正在重命名…',t=>api('/api/files/rename',{method:'PUT',headers:{'X-View-Token':t},body:{root:this.currentRoot.path,path:entry.path,new_name:name}}));},
    async remove(entry){if(!await confirmModal('删除 '+entry.name+'？此操作无法撤销。'))return;await this.writeAction('正在删除…',t=>api('/api/files/delete?root='+encodeURIComponent(this.currentRoot.path)+'&path='+encodeURIComponent(entry.path),{method:'DELETE',headers:{'X-View-Token':t}}));},
    setClipboard(entry,move){this.clipboard={path:entry.path,name:entry.name,move};showToast(move?'已剪切，进入目标目录后点击粘贴':'已复制，进入目标目录后点击粘贴','success');},
    async paste(){const c=this.clipboard;await this.writeAction(c.move?'正在移动…':'正在复制…',t=>api('/api/files/transfer',{method:'POST',headers:{'X-View-Token':t},body:{root:this.currentRoot.path,source:c.path,destination:this.currentPath,move:c.move}}));this.clipboard=null;},
    async compress(entry){await this.writeAction('正在压缩…',t=>api('/api/files/compress',{method:'POST',headers:{'X-View-Token':t},body:{root:this.currentRoot.path,path:entry.path}}));},
    async extract(entry){await this.writeAction('正在安全解压…',t=>api('/api/files/extract',{method:'POST',headers:{'X-View-Token':t},body:{root:this.currentRoot.path,path:entry.path}}));},
    async upload(ev){const file=ev.target.files[0];ev.target.value='';if(!file)return;const token=await unlockViewPasswordPrompt();if(!token)return;const form=new FormData();form.append('root',this.currentRoot.path);form.append('path',this.currentPath);form.append('file',file);this.busy=true;this.busyText='正在上传 '+file.name+'…';try{await api('/api/files/upload',{method:'POST',headers:{'X-View-Token':token},body:form});showToast('上传完成','success');await this.loadFiles();}catch(e){}finally{this.busy=false;}},
    download(entry){const prefix=document.body.dataset.panelPrefix||'';window.open(prefix+'/api/files/download?root='+encodeURIComponent(this.currentRoot.path)+'&path='+encodeURIComponent(entry.path));},
    formatBytes(n){return window.formatBytes?window.formatBytes(n):n+' B';},formatTime(v){return v?new Date(v).toLocaleString():'--';}
}}
</script>
{{end}}
