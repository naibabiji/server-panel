{{template "base" .}}
{{define "website_form_content"}}
<div x-data="websiteForm()" class="p-6 max-w-2xl">
    <h2 class="text-lg font-semibold text-purple-300 mb-6" x-text="isEdit ? t('website_form.title_edit') : t('website_form.title_add')"></h2>
    <div class="card space-y-4" x-show="loading" x-cloak>
        <div class="skeleton-block h-9"></div>
        <div class="skeleton-block h-9"></div>
        <div class="skeleton-block h-9"></div>
        <div class="skeleton-block h-9"></div>
        <hr class="border-gray-700">
        <div class="grid grid-cols-2 gap-4">
            <div class="skeleton-block h-9"></div>
            <div class="skeleton-block h-9"></div>
            <div class="skeleton-block h-9"></div>
            <div class="skeleton-block h-9"></div>
        </div>
        <div class="skeleton-block h-9"></div>
    </div>
    <div class="card space-y-4" x-show="!loading">
        <div><label class="label">{{t .Lang "website_form.name_label"}}</label><input type="text" x-model="form.name" class="input-field" placeholder="{{t .Lang "website_form.name_placeholder"}}"></div>
        <div><label class="label">{{t .Lang "website_form.domain_label"}} <span class="text-red-400">*</span></label><input type="text" x-model="form.domain" class="input-field" placeholder="{{t .Lang "website_form.domain_placeholder"}}"></div>
        <div>
            <label class="label">{{t .Lang "website_form.type_label"}}</label>
            <select x-model="form.site_type" class="input-field">
                <option value="">{{t .Lang "common.select_placeholder"}}</option>
                <template x-for="t in siteTypes" :key="t"><option :value="t" x-text="t"></option></template>
            </select>
        </div>
        <div><label class="label">{{t .Lang "website_form.server_label"}} <span class="text-red-400">*</span></label>
            <select x-model.number="form.server_id" class="input-field">
                <option :value="0">{{t .Lang "common.select_placeholder"}}</option>
                <template x-for="s in servers" :key="s.id"><option :value="s.id" x-text="s.name"></option></template>
            </select>
        </div>
        <div>
            <div class="flex items-center justify-between">
                <label class="label">{{t .Lang "server_form.customer_label"}}</label>
                <button type="button" @click="quickAddCustomer()" class="text-xs text-blue-400 hover:text-blue-300">{{t .Lang "server_form.add_customer"}}</button>
            </div>
            <select x-model="form.customer_id" class="input-field">
                <option value="">{{t .Lang "common.select_placeholder"}}</option>
                <template x-for="c in customers" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
            </select>
        </div>
        <hr class="border-gray-700">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="label">{{t .Lang "server_form.panel_type_label"}}</label>
                <select x-model="form.panel_type" class="input-field">
                    <option value="none">{{t .Lang "server_form.panel_none"}}</option><option value="baota">{{t .Lang "server_form.panel_baota"}}</option>
                    <option value="wp-panel">WP Panel</option><option value="1panel">1Panel</option>
                    <option value="cyberpanel">CyberPanel</option><option value="directadmin">DirectAdmin</option>
                    <option value="cpanel">cPanel</option><option value="other">{{t .Lang "server_form.panel_other"}}</option>
                </select>
            </div>
            <div><label class="label">{{t .Lang "server_form.panel_url_label"}}</label><input type="text" x-model="form.panel_url" class="input-field" placeholder="https://..."></div>
            <div><label class="label">{{t .Lang "website_form.panel_username_label"}}</label><input type="text" x-model="form.panel_username" class="input-field" autocomplete="off"></div>
            <div>
                <div class="flex items-center justify-between">
                    <label class="label">{{t .Lang "server_form.panel_password_label"}}</label>
                    <button type="button" @click="revealPanelPassword()" class="text-xs text-blue-400 hover:text-blue-300" x-show="isEdit">{{t .Lang "website_form.reveal_saved_password"}}</button>
                </div>
                <input type="text" x-model="form.panel_password" class="input-field" placeholder="{{t .Lang "website_form.panel_password_placeholder"}}" autocomplete="off">
                <code class="block text-xs text-green-200 break-all mt-2" x-show="panelPassword" x-text="panelPassword"></code>
            </div>
        </div>
        <div><label class="label">{{t .Lang "server_form.expiry_date_label"}}</label><input type="date" x-model="form.expiry_date" class="input-field"></div>
        <div>
            <label class="label">{{t .Lang "website_form.status_label"}}</label>
            <select x-model="form.status" class="input-field w-48">
                <option value="active">{{t .Lang "server_detail.website_status_running"}}</option><option value="expired">{{t .Lang "server_detail.website_status_expired"}}</option>
            </select>
        </div>
        <div><label class="label">{{t .Lang "server_form.notes_label"}}</label><textarea x-model="form.notes" class="input-field" rows="3"></textarea></div>
        <div class="flex gap-3 pt-2">
            <button @click="save()" class="btn-primary" :disabled="saving"><span x-show="!saving">{{t .Lang "common.save"}}</span><span x-show="saving">{{t .Lang "common.saving"}}</span></button>
            <a href="/{{.RandomSuffix}}/websites" class="btn-secondary">{{t .Lang "common.cancel"}}</a>
        </div>
    </div>
</div>
<script>
function websiteForm() {
    return {
        isEdit: false, id: null, saving: false, loading: false, panelPassword: '',
        form: { name:'', domain:'', site_type:'', server_id:0, customer_id:'', panel_type:'none', panel_url:'', panel_username:'', panel_password:'', expiry_date:'', status:'active', notes:'' },
        servers: [], customers: [], siteTypes: [],
        async init() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const last = parts[parts.length-1];
            if (last === 'edit') this.id = parts[parts.length-2];
            else if (last !== 'new') this.id = last;
            if (this.id) { this.isEdit = true; this.loading = true; }
            // 并行加载下拉数据源，确保编辑回显时选项已存在，下拉才能正确选中。
            // loading 必须在这一步之前置 true，理由同 server_form.html。
            await Promise.all([
                (async () => { try { const d = await cachedApi('/api/servers?page_size=100', {}, { ttl: API_CACHE_TTL_LIST }); this.servers = d.data.items || []; } catch(e) {} })(),
                (async () => { try { const d = await cachedApi('/api/customers?page_size=100', {}, { ttl: API_CACHE_TTL_STABLE_LIST }); this.customers = d.data.items || []; } catch(e) {} })(),
                (async () => { try { const d = await cachedApi('/api/settings/site-type-list'); this.siteTypes = JSON.parse(d.data.svalue || '[]'); } catch(e) {} })(),
            ]);
            if (this.id) {
                await this.load();
                this.loading = false;
            } else {
                // 从服务器详情页跳转过来时，自动预选所属服务器
                const serverID = parseInt(new URLSearchParams(window.location.search).get('server_id'), 10);
                if (serverID) {
                    this.form.server_id = serverID;
                    if (!this.servers.some(s => s.id === serverID)) {
                        this.servers = [{id: serverID, name: t('website_form.fallback_server_name', {id: serverID})}, ...this.servers];
                    }
                }
            }
        },
        async load() {
            try {
                const d = await api('/api/websites/'+this.id); const w = d.data;
                Object.keys(this.form).forEach(k => { if (w[k] !== undefined && w[k] !== null) this.form[k] = w[k]; });
                // 若保存的引用不在当前下拉列表中（如已被删除），注入以便正确回显
                if (w.customer_id && !this.customers.some(c => c.id === w.customer_id)) {
                    this.customers = [{id: w.customer_id, name: t('server_form.fallback_customer_name', {id: w.customer_id})}, ...this.customers];
                }
                if (w.server_id && !this.servers.some(s => s.id === w.server_id)) {
                    this.servers = [{id: w.server_id, name: t('website_form.fallback_server_name', {id: w.server_id})}, ...this.servers];
                }
                if (w.site_type && !this.siteTypes.includes(w.site_type)) {
                    this.siteTypes = [w.site_type, ...this.siteTypes];
                }
            } catch(e) {}
        },
        async refreshCustomers(selectedID) {
            try {
                const d = await cachedApi('/api/customers?page_size=100', {}, { ttl: API_CACHE_TTL_STABLE_LIST });
                this.customers = d.data.items || [];
                if (selectedID !== undefined && selectedID !== null) this.form.customer_id = selectedID;
            } catch(e) {}
        },
        async quickAddCustomer() {
            const name = prompt(t('server_form.prompt_customer_name'));
            if (!name) return;
            try {
                const d = await api('/api/customers', {method:'POST', body:{name}});
                await this.refreshCustomers(d.data.id);
                showToast(t('server_form.customer_created'),'success');
            } catch(e) { showToast(e.message,'error'); }
        },
        async revealPanelPassword() {
            try {
                const viewToken = await unlockViewPasswordPrompt();
                if (!viewToken) return;
                const d = await api('/api/websites/'+this.id+'/secrets/panel-password', {headers:{'X-View-Token': viewToken}});
                this.panelPassword = d.data.value || '';
                if (!this.panelPassword) showToast(t('website_form.panel_password_not_saved'),'warning');
            } catch(e) {}
        },
        async save() {
            this.saving = true;
            try {
                if (!this.form.domain) { showToast(t('website_form.domain_required'),'error'); this.saving=false; return; }
                if (!this.form.server_id) { showToast(t('website_form.server_required'),'error'); this.saving=false; return; }
                const payload = { ...this.form };
                payload.server_id = parseInt(payload.server_id, 10) || 0;
                payload.customer_id = payload.customer_id ? parseInt(payload.customer_id, 10) : null;
                if (!payload.panel_password) delete payload.panel_password;
                const method = this.isEdit ? 'PUT' : 'POST';
                const url = this.isEdit ? '/api/websites/'+this.id : '/api/websites';
                await api(url, {method, body: payload});
                showToast(t('common.save_success'),'success');
                const target = this.isEdit ? '/websites/' + this.id : '/websites';
                setTimeout(() => location.href = document.body.dataset.panelPrefix + target, 500);
            } catch(e) { showToast(e.message,'error'); }
            this.saving = false;
        }
    }
}
</script>
{{end}}
